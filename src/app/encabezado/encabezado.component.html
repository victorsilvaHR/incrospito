<div *ngIf="titulo != ''">
<!-- Imagen de fondo -->
<div
  *ngIf="!(esInicio && esMovil)"
  class="background-image">
</div>

<!-- Overlay -->
<div
  *ngIf="!(esInicio && esMovil)"
  class="overlay">
</div>

<!-- Contenido del encabezado -->
<div class="header-container">
  <h1 class="titulo-contacto">{{ titulo }}</h1>
  <p class="subtitulo-contacto">{{ subtitulo }}</p>
</div>

</div>
